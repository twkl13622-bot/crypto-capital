<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت</title>
<style>
body {
    font-family: Tahoma, Arial;
    background: #f1f5f9;
    margin: 0;
    padding: 20px;
    color: #222;
}
.container {
    max-width: 900px;
    margin: auto;
}
h2 { text-align: center; }
.cards {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
}
.card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    flex: 1;
    min-width: 130px;
    text-align: center;
    box-shadow: 0 2px 8px #ddd;
}
.number {
    font-size: 23px;
    color: #087c55;
    margin-top: 10px;
}
button {
    padding: 12px 20px;
    margin: 8px 3px;
    border: 0;
    border-radius: 7px;
    background: #087c55;
    color: white;
}
table {
    width: 100%;
    background: white;
    margin-top: 15px;
    border-collapse: collapse;
}
td, th {
    padding: 12px;
    border: 1px solid #ddd;
    text-align: center;
}
.notice {
    background: #fff3cd;
    padding: 15px;
    border-radius: 8px;
    margin-top: 20px;
}
</style>
</head>

<body>
<div class="container">

<h2>پنل مدیریت سایت</h2>
