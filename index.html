<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>USDT Growth — BEP20</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#07111f,#12223a);font-family:Tahoma,Arial,sans-serif;color:#fff}.card{width:min(720px,100%);background:#111c30;border:1px solid #2b3d5d;border-radius:24px;padding:28px;box-shadow:0 25px 80px #0007}.top{text-align:center}.top h1{font-size:34px;margin:0 0 8px}.muted{color:#9eabc2;line-height:1.9}.badge{display:inline-block;margin-top:10px;padding:7px 13px;border-radius:99px;background:#123b30;color:#6ee5ad;font-size:13px}.box{margin-top:22px;background:#0a1425;border:1px solid #263653;border-radius:18px;padding:20px}.address{direction:ltr;text-align:left;word-break:break-all;background:#050b14;padding:15px;border-radius:12px;font:13px monospace;line-height:1.7;margin:12px 0}button{width:100%;padding:14px;border:0;border-radius:12px;background:#35d399;color:#03140d;font-weight:700;font-size:15px;cursor:pointer}.status{color:#70e6b2;font-size:13px;margin-top:12px}.notice{margin-top:20px;padding:14px;border-radius:12px;background:#211b0d;color:#e6c66e;font-size:13px;line-height:1.9}
</style></head>
<body><main class="card"><div class="top"><h1>USDT Growth</h1><div class="muted">دریافت USDT روی شبکه BNB Smart Chain</div><span class="badge">USDT • BEP20</span></div>
<section 0x3ceaa206e71b3a03d7596be8c9214e36361aae11</div><button onclick="copyAddress()">کپی آدرس</button><div id="status" class="status"></div></section>
<div class="notice"><b>توجه:</b> قبل از ارسال، شبکه BEP20 و آدرس مقصد را بررسی کنید. این صفحه فقط برای دریافت و نمایش آدرس است و سود تضمینی ارائه نمی‌کند.</div></main>
<script>function copyAddress(){const a=document.getElementById('wallet').textContent.trim();navigator.clipboard.writeText(a).then(()=>document.getElementById('status').textContent='آدرس کپی شد.').catch(()=>document.getElementById('status').textContent='کپی خودکار انجام نشد؛ آدرس را دستی کپی کنید.');}</script>
</body></html>
