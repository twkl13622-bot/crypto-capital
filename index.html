<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crypto Capital</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
margin:0;background:#09111f;color:white;
font-family:Tahoma,Arial;
}
header{
background:#14243b;padding:22px;
text-align:center;font-size:24px;
color:#35df9b;font-weight:bold;
}
.container{max-width:600px;margin:auto;padding:15px}
.box{
background:#17283f;padding:20px;
border-radius:14px;margin-bottom:15px;
}
h3{color:#35df9b}
input,button,select{
width:100%;padding:14px;margin:7px 0;
border:0;border-radius:8px;font-size:15px;
}
input,select{background:#263b55;color:white}
button{
background:#12a875;color:white;
font-weight:bold;cursor:pointer;
}
button.gray{background:#354c69}
button.red{background:#bd4141}
.hidden{display:none}
.menu{
display:grid;grid-template-columns:1fr 1fr;gap:8px
}
.balance{
text-align:center;font-size:27px;
color:#35df9b;padding:15px
}
.item{
background:#263b55;padding:12px;
border-radius:8px;margin:8px 0;
overflow-wrap:anywhere;
}
small{color:#bdc9d8}
</style>
</head>

<body>

<header>CRYPTO CAPITAL</header>

<div class="container">

<div id="auth" class="box">
<h3>ورود / ثبت نام</h3>
<input id="email" type="email" placeholder="ایمیل">
<input id="password" type="password" placeholder="رمز عبور">

<button onclick="register()">ثبت نام</button>
<button class="gray" onclick="login()">ورود</button>
</div>

<div id="app" class="hidden">

<div class="box">
<h3>داشبورد</h3>
<p id="userEmail"></p>
<div class="balance">حساب کاربری</div>
<p>موجودی و سود فقط پس از ثبت و تأیید اطلاعات نمایش داده می‌شوند.</p>
</div>

<div class="box menu">
<button onclick="page('deposit')">واریز</button>
<button onclick="page('withdraw')">برداشت</button>
<button onclick="page('profit')">سود روزانه</button>
<button onclick="page('profile')">پروفایل</button>
<button onclick="page('history')">تاریخچه</button>
</div>

<div id="deposit" class="box hidden">
<h3>واریز تتر USDT</h3>
<p>شبکه: BEP20</p>
<input id="mainWallet" readonly>
<button class="gray" onclick="copyWallet()">کپی آدرس کیف پول</button>

<input id="depAmount" type="number" placeholder="مبلغ واریز">
<input id="depTx" placeholder="شناسه تراکنش TXID">

<button onclick="deposit()">ثبت درخواست واریز</button>
</div>

<div id="withdraw" class="box hidden">
<h3>برداشت وجه</h3>
<input id="withAmount" type="number" placeholder="مبلغ برداشت">
<input id="withWallet" placeholder="آدرس کیف پول شما">

<select id="withNetwork">
<option value="BEP20">BEP20</option>
</select>

<button onclick="withdraw()">ثبت درخواست برداشت</button>
</div>

<div id="profit" class="box hidden">
<h3>سود روزانه ثبت شده</h3>
<div id="profitList"></div>

<hr>

<h3>درخواست برداشت سود</h3>
<input id="profitAmount" type="number" placeholder="مبلغ برداشت سود">
<input id="profitWallet" placeholder="آدرس کیف پول">
<button onclick="profitWithdraw()">ثبت درخواست</button>
</div>

<div id="profile" class="box hidden">
<h3>پروفایل کاربری</h3>
<p id="profileInfo"></p>
<input id="username" placeholder="نام کاربری">
<input id="profileWallet" placeholder="آدرس کیف پول شخصی">
<button onclick="saveProfile()">ذخیره پروفایل</button>
<button class="red" onclick="logout()">خروج</button>
</div>

<div id="history" class="box hidden">
<h3>تاریخچه تراکنش‌ها</h3>
<div id="historyList"></div>
</div>

</div>
</div>
